<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaceMind AI</title>
<meta name="description" content="Ask questions about the FIA Formula 1 Technical Regulations. Answers are grounded in the official document.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #17191e;
    --panel-2: #1f2228;
    --line: #2b2f37;
    --text: #eceef2;
    --muted: #9198a5;
    --red: #e10600;
    --red-soft: rgba(225, 6, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
  }
  .wrap { max-width: 820px; margin: 0 auto; width: 100%; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .stripe { width: 6px; height: 28px; background: var(--red); transform: skewX(-18deg); }
  h1 {
    font: 700 26px/1 "Barlow Condensed", sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0;
  }
  h1 span { color: var(--red); }
  .tag { color: var(--muted); font-size: 13px; margin-left: auto; }

  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .empty { text-align: center; padding: 40px 0 8px; }
  .empty h2 {
    font: 600 32px/1.1 "Barlow Condensed", sans-serif;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .empty p { color: var(--muted); margin: 0 0 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
  }
  .chip:hover { border-color: var(--red); }

  .msg { margin-bottom: 18px; }
  .q {
    background: var(--panel-2);
    border-radius: 12px;
    padding: 10px 14px;
    margin-left: auto;
    max-width: 85%;
    width: fit-content;
  }
  .a {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--red);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .a :first-child { margin-top: 0; }
  .a :last-child { margin-bottom: 0; }
  .a table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  .a th, .a td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .a code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .err { border-left-color: #f5a623; color: #f5c46b; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .src { font-size: 13px; color: var(--muted); padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .src:last-child { border-bottom: 0; }
  .src b { color: var(--text); }
  .loading { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  footer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  form { display: flex; gap: 8px; }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 13px;
    font: inherit;
    min-height: 46px;
    max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--red); }
  button.send {
    background: var(--red);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 0 18px;
    font: 600 15px Inter, sans-serif;
    cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: center; }
  @media (max-width: 560px) { .tag { display: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap brand">
    <div class="stripe"></div>
    <h1>Race<span>Mind</span> AI</h1>
    <div class="tag">FIA F1 Technical Regulations assistant</div>
  </div>
</header>

<main id="chat">
  <div class="wrap" id="log">
    <div class="empty" id="empty">
      <h2>Ask the rulebook</h2>
      <p>Answers come only from the FIA Formula 1 Technical Regulations, with page references.</p>
      <div class="chips">
        <button class="chip">What are the requirements for the front wing?</button>
        <button class="chip">What are the regulations for the power unit?</button>
        <button class="chip">What is the minimum weight of the car?</button>
        <button class="chip">What are the rules on fuel?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask about the F1 technical regulations…" required></textarea>
      <button class="send" id="send" type="submit">Ask</button>
    </form>
    <div class="note">Built by Dhanushkanth Balasubramanian · RAG with ChromaDB + Groq</div>
  </div>
</footer>

<script>
  const log = document.getElementById("log");
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = (s) => DOMPurify.sanitize(marked.parse(s || ""));
  const scroll = () => (chat.scrollTop = chat.scrollHeight);

  function add(html) {
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = html;
    log.appendChild(div);
    scroll();
    return div;
  }

  async function askQuestion(q) {
    document.getElementById("empty")?.remove();
    add(`<div class="q">${esc(q)}</div>`);
    const pending = add(`<div class="a loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Checking the regulations…</div>`);
    send.disabled = true;
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
      const sources = (data.sources || [])
        .map((s) => `<div class="src"><b>Page ${esc(s.page ?? "?")}</b> · ${esc(s.snippet)}…</div>`)
        .join("");
      pending.innerHTML = `<div class="a">${md(data.answer)}${sources ? `<details><summary>Sources (${data.sources.length})</summary>${sources}</details>` : ""}</div>`;
    } catch (e) {
      pending.innerHTML = `<div class="a err">${esc(typeof e.message === "string" ? e.message : "Something went wrong")}</div>`;
    } finally {
      send.disabled = false;
      scroll();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || send.disabled) return;
    input.value = "";
    input.style.height = "";
    askQuestion(q);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => askQuestion(c.textContent)));
</script>
</body>
</html>
