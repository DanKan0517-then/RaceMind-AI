name: Deploy to Hugging Face Space

# Every push to main is mirrored to the Space, which rebuilds the Docker image.
# Setup (once, in GitHub repo Settings):
#   Secrets  -> HF_TOKEN  : a Hugging Face token with write access
#   Variables -> HF_SPACE : <hf-username>/racemind-ai

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN secret and HF_SPACE variable first"
            exit 1
          fi
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
